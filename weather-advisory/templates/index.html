<!DOCTYPE html>
<html>
<head>
    <title>Smart Advisory</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: #eef2f3;
        }

        input, button {
            padding: 10px;
            margin: 8px;
        }

        button {
            background: green;
            color: white;
            border: none;
        }

        #result {
            margin-top: 20px;
            background: white;
            padding: 20px;
            width: 320px;
            margin-left: auto;
            margin-right: auto;
            border-radius: 10px;
        }
    </style>
</head>

<body>

<h1>🌾 Smart Weather Advisory</h1>

<input type="text" id="city" placeholder="Enter city">
<br>

<input type="text" id="crop" placeholder="Enter crop (optional)">
<br>

<button onclick="getAdvisory()">Get Advisory</button>

<div id="result"></div>

<script>
async function getAdvisory() {

    const city = document.getElementById("city").value;
    const crop = document.getElementById("crop").value;

    try {
        const response = await fetch("/get_advisory", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                city: city,
                crop: crop
            })
        });

        const data = await response.json();

        if (data.error) {
            document.getElementById("result").innerHTML = data.error;
            return;
        }

        let output = `
            <h3>🌦 Weather Info</h3>
            <p>Temperature: ${data.temperature} °C</p>
            <p>Humidity: ${data.humidity}%</p>
            <p>Wind: ${data.wind} m/s</p>

            <h3>🌱 Advisory</h3>
            <ul>
        `;

        data.advice.forEach(item => {
            output += `<li>${item}</li>`;
        });

        output += "</ul>";

        document.getElementById("result").innerHTML = output;

    } catch (error) {
        console.error(error);
        document.getElementById("result").innerHTML = "Error fetching data";
    }
}
</script>

</body>
</html>
